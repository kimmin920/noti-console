name: Build dev Docker images

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: docker-dev-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  APP_IMAGE: ghcr.io/kimmin920/noti-console
  MIGRATE_IMAGE: ghcr.io/kimmin920/noti-console-migrate

jobs:
  build:
    name: Build and push dev images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build values
        id: build-values
        env:
          NEXT_PUBLIC_APP_URL: ${{ vars.NEXT_PUBLIC_APP_URL_DEV }}
          NEXT_PUBLIC_APP_VERSION_VAR: ${{ vars.NEXT_PUBLIC_APP_VERSION }}
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV }}
        run: |
          set -euo pipefail

          short_sha="$(git rev-parse --short=12 HEAD)"
          subject="$(git log -1 --pretty=%s)"
          build_time="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          app_version="${NEXT_PUBLIC_APP_VERSION_VAR:-$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")}"

          missing=0
          require_value() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error title=Missing build value::${name} is required for the dev Docker image build."
              missing=1
            fi
          }

          require_value "vars.NEXT_PUBLIC_APP_URL_DEV" "$NEXT_PUBLIC_APP_URL"
          require_value "vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY_DEV" "$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
          require_value "NEXT_PUBLIC_BUILD_SHA" "$short_sha"
          require_value "NEXT_PUBLIC_BUILD_SUBJECT" "$subject"
          require_value "NEXT_PUBLIC_BUILD_TIME" "$build_time"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          {
            echo "app_url=$NEXT_PUBLIC_APP_URL"
            echo "app_version=$app_version"
            echo "build_sha=$short_sha"
            echo "build_subject=$subject"
            echo "build_time=$build_time"
            echo "clerk_publishable_key=$NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY"
            echo "clerk_sign_in_url=/sign-in"
            echo "clerk_sign_up_url=/sign-up"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push application image
        id: build_application_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runner
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:dev
            ${{ env.APP_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.build-values.outputs.app_url }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.build-values.outputs.app_version }}
            NEXT_PUBLIC_BUILD_SHA=${{ steps.build-values.outputs.build_sha }}
            NEXT_PUBLIC_BUILD_SUBJECT=${{ steps.build-values.outputs.build_subject }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.build-values.outputs.build_time }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ steps.build-values.outputs.clerk_publishable_key }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ steps.build-values.outputs.clerk_sign_in_url }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ steps.build-values.outputs.clerk_sign_up_url }}

      - name: Build and push migration image
        id: build_migration_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: migrate-runner
          push: true
          tags: |
            ${{ env.MIGRATE_IMAGE }}:dev
            ${{ env.MIGRATE_IMAGE }}:sha-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ steps.build-values.outputs.app_url }}
            NEXT_PUBLIC_APP_VERSION=${{ steps.build-values.outputs.app_version }}
            NEXT_PUBLIC_BUILD_SHA=${{ steps.build-values.outputs.build_sha }}
            NEXT_PUBLIC_BUILD_SUBJECT=${{ steps.build-values.outputs.build_subject }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.build-values.outputs.build_time }}
            NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${{ steps.build-values.outputs.clerk_publishable_key }}
            NEXT_PUBLIC_CLERK_SIGN_IN_URL=${{ steps.build-values.outputs.clerk_sign_in_url }}
            NEXT_PUBLIC_CLERK_SIGN_UP_URL=${{ steps.build-values.outputs.clerk_sign_up_url }}

      - name: Keep the latest three dev image versions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_DEV_PACKAGES: noti-console,noti-console-migrate
          GHCR_DEV_SHA_KEEP: "3"
        run: node .github/scripts/prune-ghcr-dev-images.mjs

      - name: Trigger Dokploy dev redeploy
        env:
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_API_URL: ${{ vars.DOKPLOY_API_URL }}
          DOKPLOY_DEV_COMPOSE_ID: ${{ vars.DOKPLOY_DEV_COMPOSE_ID }}
        run: |
          set -euo pipefail

          missing=0
          require_value() {
            local name="$1"
            local value="$2"
            if [ -z "$value" ]; then
              echo "::error title=Missing Dokploy deploy value::${name} is required to deploy noti-console-dev after the image build."
              missing=1
            fi
          }

          require_value "vars.DOKPLOY_API_URL" "$DOKPLOY_API_URL"
          require_value "vars.DOKPLOY_DEV_COMPOSE_ID" "$DOKPLOY_DEV_COMPOSE_ID"
          require_value "secrets.DOKPLOY_API_KEY" "$DOKPLOY_API_KEY"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

          echo "Triggering noti-console-dev after GHCR images are available."
          echo "Application image digest: ${{ steps.build_application_image.outputs.digest }}"
          echo "Migration image digest: ${{ steps.build_migration_image.outputs.digest }}"

          curl \
            --fail-with-body \
            --retry 3 \
            --retry-all-errors \
            --retry-delay 5 \
            --show-error \
            --silent \
            --header "accept: application/json" \
            --header "content-type: application/json" \
            --header "x-api-key: $DOKPLOY_API_KEY" \
            --request POST \
            --data "{\"composeId\":\"$DOKPLOY_DEV_COMPOSE_ID\"}" \
            "$DOKPLOY_API_URL/api/compose.deploy"
