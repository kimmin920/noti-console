x-app-environment: &app-environment
  NODE_ENV: production
  NEXT_TELEMETRY_DISABLED: "1"

services:
  migrate:
    image: ${MIGRATE_IMAGE:?MIGRATE_IMAGE is required}
    pull_policy: always
    env_file:
      - .env
    environment:
      <<: *app-environment
    command: npm run db:migration:apply
    restart: "no"

  web:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    pull_policy: always
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "3000"
    restart: unless-stopped

  worker:
    image: ${APP_IMAGE:?APP_IMAGE is required}
    pull_policy: always
    command: npm run worker
    env_file:
      - .env
    environment:
      <<: *app-environment
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
