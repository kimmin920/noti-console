services:
  web:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://messaging:messaging@postgres:5432/messaging_app}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost}
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: npm run worker
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgres://messaging:messaging@postgres:5432/messaging_app}
      WORKER_INTERVAL_MS: ${WORKER_INTERVAL_MS:-60000}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-messaging_app}
      POSTGRES_USER: ${POSTGRES_USER:-messaging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-messaging}
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:${POSTGRES_HOST_PORT:-55432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-messaging} -d ${POSTGRES_DB:-messaging_app}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
